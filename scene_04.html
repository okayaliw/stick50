<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scene 04: The Provider</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@700&display=swap');
        body { margin: 0; overflow: hidden; background-color: #0a0e27; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="srt-data" type="text/plain">
47
00:03:33,520 --> 00:03:38,720
Then the algorithm feeds him the most common specimen of all, the guy holding a fish.

48
00:03:39,410 --> 00:03:40,430
Darwin pauses.

49
00:03:40,780 --> 00:03:43,150
He has seen this display in hundreds of profiles.

50
00:03:43,620 --> 00:03:46,810
A male grinning, holding a dead bass towards the camera.

51
00:03:47,430 --> 00:03:48,600
Darwin nods slowly.

52
00:03:49,150 --> 00:03:50,810
Finally, something that makes sense.

53
00:03:51,260 --> 00:03:53,500
This is a classic provider signal.

54
00:03:53,470 --> 00:03:56,580
The male is demonstrating his ability to secure resources.

55
00:03:56,980 --> 00:04:01,360
He's showing the female that if they mate, he can provide protein for the offspring.

56
00:04:01,740 --> 00:04:03,160
But then Darwin looks closer.

57
00:04:03,550 --> 00:04:04,480
The fish is small.

58
00:04:04,740 --> 00:04:05,900
It is barely a snack.

59
00:04:06,410 --> 00:04:12,880
He calculates that this fish provides perhaps 200 calories, hardly enough to sustain a family through a harsh winter.

60
00:04:13,760 --> 00:04:20,440
Furthermore, the male is wearing sunglasses indoors, which suggests poor vision or a lack of situational awareness.

61
00:04:20,830 --> 00:04:25,480
Darwin concludes that while the hunting instinct is present, the execution is flawed.

62
00:04:25,970 --> 00:04:31,430
He notes that a true provider would display a harvested deer or perhaps a large sack of grain.

63
00:04:31,730 --> 00:04:34,800
He swipes left, disappointed by the caloric inefficiency.
</script>

<script>
const CONFIG = {
    width: 1920, height: 1080, fps: 60,
    colors: { bg: '#0a0e27', primary: '#00f5ff', secondary: '#ff6b9d', accent: '#ffd93d', highlight: '#6bcf7f', text: '#e8eaf6', danger: '#ff4757', glow: 'rgba(0,245,255,0.3)' }
};
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.width; canvas.height = CONFIG.height;

/** UTILS */
const ease = {
    linear: t => t,
    outQuad: t => t*(2-t),
    outBack: t => { const c1 = 1.70158; return 1 + (c1 + 1) * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    inOutCubic: t => t<.5 ? 4*t*t*t : (t-1)*(2*t-2)*(2*t-2)+1
};
function parseTime(str) {
    const [h, m, s] = str.split(':');
    const [sec, ms] = s.split(',');
    return (parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(sec)) * 1000 + parseInt(ms);
}
function parseSRT() {
    const raw = document.getElementById('srt-data').textContent.trim();
    const blocks = raw.split(/\n\s*\n/);
    const entries = blocks.map(b => {
        const lines = b.split('\n');
        if(lines.length < 3) return null;
        const [start, end] = lines[1].split(' --> ').map(parseTime);
        return { start, end, text: lines.slice(2).join(' ') };
    }).filter(e => e);
    const offset = entries[0].start;
    entries.forEach(e => { e.start -= offset; e.end -= offset; });
    return { entries, duration: entries[entries.length-1].end + 2000 };
}

/** DRAWING */
function drawFish(ctx, x, y, size, isSmall) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size, size);

    // Body
    ctx.fillStyle = isSmall ? '#888' : CONFIG.colors.highlight;
    ctx.beginPath();
    ctx.ellipse(0, 0, isSmall ? 20 : 60, isSmall ? 10 : 30, 0, 0, Math.PI*2);
    ctx.fill();

    // Tail
    ctx.beginPath();
    ctx.moveTo(isSmall ? -20 : -60, 0);
    ctx.lineTo(isSmall ? -30 : -90, isSmall ? -10 : -30);
    ctx.lineTo(isSmall ? -30 : -90, isSmall ? 10 : 30);
    ctx.fill();

    ctx.restore();
}

const SCENE_DATA = parseSRT();
const SHOTS = [
    // 1. The Wall of Fish (0-6s)
    {
        start: 0, end: 6000,
        render: (ctx, t, globalT) => {
            ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

            const cols = 5;
            const rows = 3;
            const w = CONFIG.width/cols;
            const h = CONFIG.height/rows;

            for(let i=0; i<cols*rows; i++) {
                const cx = (i % cols) * w + w/2;
                const cy = Math.floor(i / cols) * h + h/2;

                // Profile Box
                ctx.strokeStyle = CONFIG.colors.dimText;
                ctx.strokeRect(cx - w/2 + 10, cy - h/2 + 10, w - 20, h - 20);

                // Guy
                ctx.fillStyle = '#555';
                ctx.beginPath(); ctx.arc(cx, cy - 20, 30, 0, Math.PI*2); ctx.fill();

                // Fish
                drawFish(ctx, cx + 20, cy + 20, 1, false);
            }

            drawText(ctx, "COMMON SPECIMEN", CONFIG.width/2, CONFIG.height/2, 80, 'center', CONFIG.colors.text);
        }
    },
    // 2. Darwin Nods (6-13s)
    {
        start: 6000, end: 13000,
        render: (ctx, t, globalT) => {
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             // Checkmark
             const scale = ease.outBack(t);
             ctx.translate(CONFIG.width/2, CONFIG.height/2);
             ctx.scale(scale, scale);

             ctx.strokeStyle = CONFIG.colors.highlight;
             ctx.lineWidth = 20;
             ctx.lineCap = 'round';
             ctx.beginPath();
             ctx.moveTo(-100, 0);
             ctx.lineTo(0, 100);
             ctx.lineTo(200, -200);
             ctx.stroke();

             ctx.font = 'bold 60px "Space Grotesk"';
             ctx.fillStyle = CONFIG.colors.highlight;
             ctx.textAlign = 'center';
             ctx.fillText("PROVIDER SIGNAL", 0, 250);
        }
    },
    // 3. Resource Security (13-20s)
    {
        start: 13000, end: 20000,
        render: (ctx, t, globalT) => {
             // Bear catching salmon
             const bearX = 400;
             const fishX = 1400 - t * 1000;

             // Bear
             ctx.fillStyle = '#8B4513';
             ctx.beginPath(); ctx.ellipse(bearX, CONFIG.height/2, 100, 150, 0, 0, Math.PI*2); ctx.fill();

             // Salmon
             drawFish(ctx, fishX, CONFIG.height/2 - 50, 1.5, false);

             if (fishX < bearX + 100) {
                 ctx.fillStyle = CONFIG.colors.highlight;
                 ctx.fillText("PROTEIN SECURED", CONFIG.width/2, 200);
             }
        }
    },
    // 4. Tiny Fish (20-27s)
    {
        start: 20000, end: 27000,
        render: (ctx, t, globalT) => {
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             // Zoom in
             const scale = 1 + t*2;
             ctx.translate(CONFIG.width/2, CONFIG.height/2);
             ctx.scale(scale, scale);

             drawFish(ctx, 0, 0, 0.5, true); // Tiny

             ctx.font = 'bold 40px "JetBrains Mono"';
             ctx.fillStyle = CONFIG.colors.text;
             ctx.textAlign = 'center';
             ctx.fillText("SIZE: MICRO", 0, 100);
        }
    },
    // 5. Calorie Count (27-33s)
    {
        start: 27000, end: 33000,
        render: (ctx, t, globalT) => {
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             // Counter
             const cals = Math.floor(t * 200);
             ctx.font = 'bold 200px "Space Grotesk"';
             ctx.fillStyle = cals < 500 ? CONFIG.colors.danger : CONFIG.colors.highlight;
             ctx.textAlign = 'center';
             ctx.fillText(cals + " kcal", CONFIG.width/2, CONFIG.height/2);

             ctx.font = 'bold 60px "Inter"';
             ctx.fillText("WINTER SURVIVAL: IMPOSSIBLE", CONFIG.width/2, CONFIG.height - 200);
        }
    },
    // 6. Sunglasses (33-40s)
    {
        start: 33000, end: 40000,
        render: (ctx, t, globalT) => {
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             // Face with shades
             ctx.fillStyle = '#ffccaa';
             ctx.beginPath(); ctx.arc(CONFIG.width/2, CONFIG.height/2, 100, 0, Math.PI*2); ctx.fill();

             // Shades
             ctx.fillStyle = '#000';
             ctx.fillRect(CONFIG.width/2 - 80, CONFIG.height/2 - 20, 70, 40);
             ctx.fillRect(CONFIG.width/2 + 10, CONFIG.height/2 - 20, 70, 40);
             ctx.strokeStyle = '#000'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(CONFIG.width/2, CONFIG.height/2); ctx.lineTo(CONFIG.width/2 - 80, CONFIG.height/2); ctx.stroke();

             // Vision Cone
             ctx.fillStyle = 'rgba(255, 71, 87, 0.3)';
             ctx.beginPath();
             ctx.moveTo(CONFIG.width/2, CONFIG.height/2);
             ctx.arc(CONFIG.width/2, CONFIG.height/2, 800, Math.PI/4, 3*Math.PI/4);
             ctx.fill();

             ctx.fillStyle = CONFIG.colors.danger;
             ctx.font = 'bold 60px "Space Grotesk"';
             ctx.fillText("VISION IMPAIRED", CONFIG.width/2, 200);
        }
    },
    // 7. True Provider (40-47s)
    {
        start: 40000, end: 47000,
        render: (ctx, t, globalT) => {
             // Comparison
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             // Left: Fish
             drawFish(ctx, 400, CONFIG.height/2, 0.5, true);

             // Right: Deer/Sack
             ctx.fillStyle = '#8B4513';
             ctx.beginPath(); ctx.rect(1300, CONFIG.height/2 - 100, 200, 200); ctx.fill();
             ctx.fillStyle = '#fff'; ctx.fillText("GRAIN", 1400, CONFIG.height/2);

             // Scale
             ctx.strokeStyle = '#fff';
             ctx.lineWidth = 10;
             ctx.beginPath();
             ctx.moveTo(400, 800); ctx.lineTo(1400, 600); // Tilted
             ctx.stroke();
        }
    },
    // 8. Swipe Left (47-61s)
    {
        start: 47000, end: SCENE_DATA.duration,
        render: (ctx, t, globalT) => {
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             const x = -t * 2000;
             ctx.font = 'bold 100px "Inter"';
             ctx.fillStyle = CONFIG.colors.danger;
             ctx.textAlign = 'center';
             ctx.fillText("INEFFICIENT", CONFIG.width/2 + x, CONFIG.height/2);
        }
    }
];

function drawText(ctx, text, x, y, size, align='center', color=CONFIG.colors.text) {
    ctx.font = `bold ${size}px "Space Grotesk"`;
    ctx.textAlign = align;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
}

let recorder, chunks=[], startTime;
function startRecording() {
    recorder = new MediaRecorder(canvas.captureStream(CONFIG.fps), { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = saveVideo;
    recorder.start();
}
function saveVideo() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = 'scene_04.webm';
    a.click();
}
function loop(ts) {
    if (!startTime) { startTime = ts; startRecording(); }
    const elapsed = ts - startTime;
    const shot = SHOTS.find(s => elapsed >= s.start && elapsed < s.end);
    if (shot) shot.render(ctx, (elapsed - shot.start)/(shot.end - shot.start), elapsed);
    else if (elapsed > SCENE_DATA.duration) { recorder.stop(); return; }
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scene 07: Crypto</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@700&display=swap');
        body { margin: 0; overflow: hidden; background-color: #0a0e27; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="srt-data" type="text/plain">
85
00:06:08,530 --> 00:06:10,360
Then comes the crypto bro.

86
00:06:10,870 --> 00:06:14,480
The bio reads, "Entrepreneur, crypto enthusiast, to the moon."

87
00:06:15,100 --> 00:06:16,610
Darwin asks what crypto is.

88
00:06:17,400 --> 00:06:23,710
We explained it is a currency that doesn't exist physically, based on solving math problems to buy pictures of bored monkeys.

89
00:06:24,140 --> 00:06:25,970
Darwin puts his head in his hands.

90
00:06:26,380 --> 00:06:31,340
He spent his life studying tangible reality, fossils, bones, seeds.

91
00:06:31,650 --> 00:06:36,250
The idea that resources are now imaginary concepts breaks his Victorian brain.

92
00:06:36,920 --> 00:06:46,200
He theorizes that this is a form of runaway selection where a trait becomes desirable not because it is useful but simply because the females think it is useful.

93
00:06:46,550 --> 00:06:47,560
It's a bubble.

94
00:06:47,790 --> 00:06:56,120
He predicts that when the environmental conditions change, say the power goes out, the crypto bro will have zero survival value compared to the guy holding the fish.

95
00:06:56,660 --> 00:07:00,870
For the first time, Darwin feels a new found respect for the fish guy.

96
00:07:01,200 --> 00:07:04,180
At least you can eat a bass, you cannot eat a Bitcoin.
</script>

<script>
const CONFIG = {
    width: 1920, height: 1080, fps: 60,
    colors: { bg: '#0a0e27', primary: '#00f5ff', secondary: '#ff6b9d', accent: '#ffd93d', highlight: '#6bcf7f', text: '#e8eaf6', danger: '#ff4757', glow: 'rgba(0,245,255,0.3)' }
};
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.width; canvas.height = CONFIG.height;

/** UTILS */
const ease = {
    linear: t => t,
    outBounce: t => { const n1 = 7.5625; const d1 = 2.75; if (t < 1 / d1) { return n1 * t * t; } else if (t < 2 / d1) { return n1 * (t -= 1.5 / d1) * t + 0.75; } else if (t < 2.5 / d1) { return n1 * (t -= 2.25 / d1) * t + 0.9375; } else { return n1 * (t -= 2.625 / d1) * t + 0.984375; } },
    inOutQuad: t => t<.5 ? 2*t*t : -1+(4-2*t)*t
};
function parseTime(str) {
    const [h, m, s] = str.split(':');
    const [sec, ms] = s.split(',');
    return (parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(sec)) * 1000 + parseInt(ms);
}
function parseSRT() {
    const raw = document.getElementById('srt-data').textContent.trim();
    const blocks = raw.split(/\n\s*\n/);
    const entries = blocks.map(b => {
        const lines = b.split('\n');
        if(lines.length < 3) return null;
        const [start, end] = lines[1].split(' --> ').map(parseTime);
        return { start, end, text: lines.slice(2).join(' ') };
    }).filter(e => e);
    const offset = entries[0].start;
    entries.forEach(e => { e.start -= offset; e.end -= offset; });
    return { entries, duration: entries[entries.length-1].end + 2000 };
}

/** DRAWING */
function drawCoin(ctx, x, y, size, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(Math.cos(t), 1);
    ctx.scale(size, size);

    ctx.fillStyle = '#f7931a';
    ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI*2); ctx.fill();

    // B
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 60px "Inter"';
    ctx.textAlign = 'center';
    ctx.fillText("B", 0, 20);

    ctx.restore();
}

function drawApe(ctx, x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size, size);
    ctx.fillStyle = '#333'; // Ape body
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI*2); ctx.fill();
    // Eyes bored
    ctx.fillStyle = '#fff'; ctx.fillRect(-20, -10, 15, 10); ctx.fillRect(5, -10, 15, 10);
    ctx.fillStyle = '#000'; ctx.fillRect(-15, -5, 5, 5); ctx.fillRect(10, -5, 5, 5);
    // Mouth
    ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-10, 20); ctx.lineTo(10, 20); ctx.stroke();

    // Hat
    ctx.fillStyle = CONFIG.colors.primary; ctx.fillRect(-30, -50, 60, 20);

    ctx.restore();
}

const SCENE_DATA = parseSRT();
const SHOTS = [
    // 1. Crypto Bro (0-6s)
    {
        start: 0, end: 6000,
        render: (ctx, t, globalT) => {
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             drawText(ctx, "PROFILE: CRYPTO BRO", CONFIG.width/2, 100, 60);

             // Rocket
             const y = 800 - t*600;
             const x = CONFIG.width/2 + Math.sin(t*20)*10;

             ctx.font = '100px "Inter"';
             ctx.fillText("🚀", x, y);
             drawText(ctx, "TO THE MOON", x, y + 100, 40);
        }
    },
    // 2. What is Crypto (6-12s)
    {
        start: 6000, end: 12000,
        render: (ctx, t, globalT) => {
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             drawText(ctx, "IMAGINARY CURRENCY", CONFIG.width/2, 100, 50, 'center', CONFIG.colors.primary);

             // Math -> Monkey
             drawText(ctx, "MATH", 400, CONFIG.height/2, 60);

             ctx.strokeStyle = CONFIG.colors.text;
             ctx.lineWidth = 5;
             ctx.beginPath(); ctx.moveTo(600, CONFIG.height/2); ctx.lineTo(1200, CONFIG.height/2); ctx.stroke(); // Arrow

             drawApe(ctx, 1400, CONFIG.height/2, 3);
        }
    },
    // 3. Tangible Reality (12-18s)
    {
        start: 12000, end: 18000,
        render: (ctx, t, globalT) => {
             // Split
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             // Bone
             ctx.fillStyle = '#ddd';
             ctx.beginPath(); ctx.ellipse(400, CONFIG.height/2, 150, 40, 0, 0, Math.PI*2); ctx.fill();
             drawText(ctx, "FOSSIL (REAL)", 400, CONFIG.height/2 + 100, 40);

             // Bitcoin
             drawCoin(ctx, 1400, CONFIG.height/2, 3, globalT*0.005);
             drawText(ctx, "BITCOIN (FAKE?)", 1400, CONFIG.height/2 + 100, 40);

             // Darwin crying
             drawText(ctx, "VICTORIAN BRAIN BROKEN", CONFIG.width/2, 200, 60, 'center', CONFIG.colors.danger);
        }
    },
    // 4. Runaway Selection (18-28s)
    {
        start: 18000, end: 28000,
        render: (ctx, t, globalT) => {
             // Spiral
             ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

             ctx.translate(CONFIG.width/2, CONFIG.height/2);
             ctx.rotate(t * Math.PI * 4);

             for(let i=0; i<50; i++) {
                 const r = i * 10 * t;
                 const a = i * 0.5;
                 ctx.fillStyle = CONFIG.colors.primary;
                 ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 5, 0, Math.PI*2); ctx.fill();
             }
             ctx.setTransform(1,0,0,1,0,0);

             drawText(ctx, "RUNAWAY SELECTION", CONFIG.width/2, 100, 60);
             drawText(ctx, "DESIRABLE ONLY BECAUSE OTHERS DESIRE IT", CONFIG.width/2, CONFIG.height-100, 30);
        }
    },
    // 5. The Bubble (28-36s)
    {
        start: 28000, end: 36000,
        render: (ctx, t, globalT) => {
             // Bubble growing
             const r = t * 400;
             ctx.fillStyle = 'rgba(0, 245, 255, 0.2)';
             ctx.strokeStyle = CONFIG.colors.primary;
             ctx.beginPath(); ctx.arc(CONFIG.width/2, CONFIG.height/2, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();

             drawText(ctx, "BUBBLE", CONFIG.width/2, CONFIG.height/2, 40);

             if (t > 0.9) {
                 // Pop
                 ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);
                 drawText(ctx, "POP", CONFIG.width/2, CONFIG.height/2, 100, 'center', CONFIG.colors.danger);
             }
        }
    },
    // 6. Power Outage Scenario (36-44s)
    {
        start: 36000, end: 44000,
        render: (ctx, t, globalT) => {
             // Dark room
             if (t < 0.2) {
                 ctx.fillStyle = CONFIG.colors.bg; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);
                 drawText(ctx, "LIGHTS OUT", CONFIG.width/2, CONFIG.height/2, 80);
             } else {
                 ctx.fillStyle = '#000'; ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

                 // Crypto Bro (Faded)
                 ctx.globalAlpha = 0.2;
                 drawApe(ctx, 400, CONFIG.height/2, 2);
                 drawText(ctx, "VALUE: 0", 400, CONFIG.height/2 + 200, 40);

                 // Fish Guy (Lit)
                 ctx.globalAlpha = 1;
                 ctx.fillStyle = CONFIG.colors.highlight;
                 ctx.beginPath(); ctx.arc(1400, CONFIG.height/2, 100, 0, Math.PI*2); ctx.fill(); // Lamp?
                 drawText(ctx, "FISH GUY", 1400, CONFIG.height/2 + 200, 40);
             }
        }
    },
    // 7. Respect for Fish (44-48s)
    {
        start: 44000, end: 48000,
        render: (ctx, t, globalT) => {
             drawText(ctx, "RESPECT THE FISH", CONFIG.width/2, CONFIG.height/2, 60, 'center', CONFIG.colors.highlight);
        }
    },
    // 8. Edible Bitcoin (48-56s)
    {
        start: 48000, end: SCENE_DATA.duration,
        render: (ctx, t, globalT) => {
             // Bite bitcoin?
             drawCoin(ctx, CONFIG.width/2, CONFIG.height/2, 4, 0);

             // Teeth marks
             ctx.fillStyle = CONFIG.colors.bg;
             ctx.beginPath(); ctx.arc(CONFIG.width/2 + 150, CONFIG.height/2, 100, 0, Math.PI*2); ctx.fill();

             drawText(ctx, "CANNOT EAT BITCOIN", CONFIG.width/2, 200, 50, 'center', CONFIG.colors.danger);
        }
    }
];

function drawText(ctx, text, x, y, size, align='center', color=CONFIG.colors.text) {
    ctx.font = `bold ${size}px "Space Grotesk"`;
    ctx.textAlign = align;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
}

let recorder, chunks=[], startTime;
function startRecording() {
    recorder = new MediaRecorder(canvas.captureStream(CONFIG.fps), { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = saveVideo;
    recorder.start();
}
function saveVideo() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = 'scene_07.webm';
    a.click();
}
function loop(ts) {
    if (!startTime) { startTime = ts; startRecording(); }
    const elapsed = ts - startTime;
    const shot = SHOTS.find(s => elapsed >= s.start && elapsed < s.end);
    if (shot) shot.render(ctx, (elapsed - shot.start)/(shot.end - shot.start), elapsed);
    else if (elapsed > SCENE_DATA.duration) { recorder.stop(); return; }
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scene 02: Hypertrophy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@700&display=swap');
        body { margin: 0; overflow: hidden; background-color: #0a0e27; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="srt-data" type="text/plain">
18
00:01:30,220 --> 00:01:34,310
The first profile appears, it is a man named Kyle, age 27.

19
00:01:35,030 --> 00:01:37,840
Kyle's first photo is a mirror selfie in a gymnasium.

20
00:01:37,840 --> 00:01:46,260
He is flexing his bicep to an unnatural degree, his face turning a shade of crimson that in nature usually indicates toxicity.

21
00:01:46,900 --> 00:01:48,150
Darwin is fascinated.

22
00:01:48,590 --> 00:01:50,600
He leans in, squinting at the screen.

23
00:01:51,050 --> 00:01:56,210
He notes that this male is displaying hypertrophy, an excessive growth of muscle mass.

24
00:01:56,660 --> 00:02:00,870
In the wild, this would be useful for fighting off rivals or hunting large game.

25
00:02:01,220 --> 00:02:05,940
However, Darwin scrolls down and sees Kyle's job title is social media manager.

26
00:02:06,550 --> 00:02:07,750
Darwin is confused.

27
00:02:07,970 --> 00:02:12,630
Why does a man who sits at a desk require the trappings of a silverback gorilla?

28
00:02:13,220 --> 00:02:23,800
He concludes that these muscles are purely ornamental, much like the tail of a peacock, cumbersome, useless for survival, but necessary to attract a mate who values heavy lifting.

29
00:02:24,250 --> 00:02:31,560
Darwin swipes left, murdering that the energy expenditure required to maintain those pectorals is an inefficient use of calories.
</script>

<script>
const CONFIG = {
    width: 1920,
    height: 1080,
    fps: 60,
    colors: {
        bg: '#0a0e27',
        primary: '#00f5ff',
        secondary: '#ff6b9d',
        accent: '#ffd93d',
        highlight: '#6bcf7f',
        text: '#e8eaf6',
        danger: '#ff4757',
        glow: 'rgba(0,245,255,0.3)'
    }
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.width;
canvas.height = CONFIG.height;

/** UTILS */
const ease = {
    linear: t => t,
    outQuad: t => t*(2-t),
    outBack: t => { const c1 = 1.70158; return 1 + (c1 + 1) * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    inOutQuad: t => t<.5 ? 2*t*t : -1+(4-2*t)*t
};
function parseTime(str) {
    const [h, m, s] = str.split(':');
    const [sec, ms] = s.split(',');
    return (parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(sec)) * 1000 + parseInt(ms);
}

/** PARSER */
function parseSRT() {
    const raw = document.getElementById('srt-data').textContent.trim();
    const blocks = raw.split(/\n\s*\n/);
    const entries = blocks.map(b => {
        const lines = b.split('\n');
        if(lines.length < 3) return null;
        const [start, end] = lines[1].split(' --> ').map(parseTime);
        return { start, end, text: lines.slice(2).join(' ') };
    }).filter(e => e);
    const offset = entries[0].start;
    entries.forEach(e => { e.start -= offset; e.end -= offset; });
    return { entries, offset, duration: entries[entries.length-1].end + 2000 };
}

/** DRAWING */
function drawText(ctx, text, x, y, size, align='center', color=CONFIG.colors.text) {
    ctx.font = `bold ${size}px "Space Grotesk"`;
    ctx.textAlign = align;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
}

function drawMuscleArm(ctx, x, y, size, flexion, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size, size);

    // Upper Arm
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, -50, 40 + flexion*20, 60, 0, 0, Math.PI*2);
    ctx.fill();

    // Forearm
    ctx.translate(0, 0);
    ctx.rotate(-flexion * 1.5);
    ctx.beginPath();
    ctx.ellipse(0, 60, 30, 50, 0, 0, Math.PI*2);
    ctx.fill();

    // Hand
    ctx.beginPath();
    ctx.arc(0, 120, 20, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function drawPeacock(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y);

    // Feathers
    const count = 12;
    for(let i=0; i<count; i++) {
        const ang = (i/count) * Math.PI - Math.PI/2;
        const r = 200 + Math.sin(t*5 + i)*10;
        ctx.strokeStyle = CONFIG.colors.secondary;
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r); ctx.stroke();
        ctx.fillStyle = CONFIG.colors.primary;
        ctx.beginPath(); ctx.arc(Math.cos(ang)*r, Math.sin(ang)*r, 10, 0, Math.PI*2); ctx.fill();
    }

    // Body
    ctx.fillStyle = CONFIG.colors.accent;
    ctx.beginPath(); ctx.ellipse(0, 50, 30, 60, 0, 0, Math.PI*2); ctx.fill();

    ctx.restore();
}

const SCENE_DATA = parseSRT();

/** SHOT LIST (Total ~61s) */
const SHOTS = [
    // 1. Kyle Profile Load (0-4s)
    {
        start: 0, end: 4000,
        render: (ctx, t, globalT) => {
            const y = ease.outBack(t)*200;
            drawText(ctx, "PROFILE: KYLE", CONFIG.width/2, 100, 60);

            ctx.strokeStyle = CONFIG.colors.primary;
            ctx.lineWidth = 4;
            ctx.strokeRect(CONFIG.width/2 - 200, CONFIG.height/2 - 300, 400, 600);

            drawText(ctx, "AGE: 27", CONFIG.width/2, CONFIG.height/2 + 200, 40);
            drawMuscleArm(ctx, CONFIG.width/2, CONFIG.height/2 - 50, 2, 0.5, CONFIG.colors.text);
        }
    },
    // 2. Unnatural Flex (4-10s)
    {
        start: 4000, end: 10000,
        render: (ctx, t, globalT) => {
            const flex = 0.5 + Math.sin(t*10)*0.1 + t*0.5;
            const color = t > 0.5 ? CONFIG.colors.danger : CONFIG.colors.text;

            drawMuscleArm(ctx, CONFIG.width/2, CONFIG.height/2, 3, flex, color);

            if (t > 0.5) {
                 drawText(ctx, "TOXICITY DETECTED", CONFIG.width/2, 200, 60, 'center', CONFIG.colors.danger);
            }
        }
    },
    // 3. Hypertrophy Analysis (10-16s)
    {
        start: 10000, end: 16000,
        render: (ctx, t, globalT) => {
             // Grid Overlay
             ctx.strokeStyle = 'rgba(0, 245, 255, 0.2)';
             for(let x=0; x<CONFIG.width; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CONFIG.height); ctx.stroke(); }

             drawText(ctx, "HYPERTROPHY", CONFIG.width/2, 150, 72, 'center', CONFIG.colors.highlight);

             // Graph growing
             const h = t * 400;
             ctx.fillStyle = CONFIG.colors.highlight;
             ctx.fillRect(CONFIG.width/2 - 50, CONFIG.height - 100 - h, 100, h);
             drawText(ctx, "MASS", CONFIG.width/2, CONFIG.height - 50, 30);
        }
    },
    // 4. Wild Use (16-21s)
    {
        start: 16000, end: 21000,
        render: (ctx, t, globalT) => {
            // Caveman vs Tiger
            const x1 = 400 + t*100;
            const x2 = 1400 - t*100;

            drawText(ctx, "ANCESTRAL USE", CONFIG.width/2, 100, 50);

            ctx.fillStyle = CONFIG.colors.text;
            ctx.fillRect(x1, CONFIG.height/2, 100, 200); // Man
            ctx.fillStyle = CONFIG.colors.danger;
            ctx.fillRect(x2, CONFIG.height/2 + 50, 200, 100); // Beast

            if (x2 - x1 < 200) {
                // Impact
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc((x1+x2)/2, CONFIG.height/2 + 100, 100 * Math.sin(t*20), 0, Math.PI*2); ctx.fill();
            }
        }
    },
    // 5. Social Media Manager (21-27s)
    {
        start: 21000, end: 27000,
        render: (ctx, t, globalT) => {
            drawText(ctx, "JOB TITLE:", CONFIG.width/2, 200, 40);
            drawText(ctx, "SOCIAL MEDIA MANAGER", CONFIG.width/2, 300, 60, 'center', CONFIG.colors.primary);

            // Tiny laptop
            const scale = ease.outBack(t);
            ctx.save();
            ctx.translate(CONFIG.width/2, CONFIG.height/2);
            ctx.scale(scale, scale);
            ctx.fillStyle = '#333';
            ctx.fillRect(-100, 0, 200, 120);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-90, 10, 180, 100);
            ctx.restore();

            // Giant muscles trying to type
            drawMuscleArm(ctx, CONFIG.width/2 - 150, CONFIG.height/2, 1.5, 0.8, CONFIG.colors.text);
            drawMuscleArm(ctx, CONFIG.width/2 + 150, CONFIG.height/2, 1.5, 0.8, CONFIG.colors.text);
        }
    },
    // 6. Silverback Gorilla (27-32s)
    {
        start: 27000, end: 32000,
        render: (ctx, t, globalT) => {
            // Gorilla Silhouette
            ctx.fillStyle = CONFIG.colors.text;
            ctx.beginPath();
            ctx.arc(CONFIG.width/2, CONFIG.height/2 - 100, 80, 0, Math.PI*2); // Head
            ctx.ellipse(CONFIG.width/2, CONFIG.height/2 + 50, 150, 200, 0, 0, Math.PI*2); // Body
            ctx.fill();

            drawText(ctx, "SILVERBACK?", CONFIG.width/2, 200, 60);
        }
    },
    // 7. Ornamental Peacock (32-42s)
    {
        start: 32000, end: 42000,
        render: (ctx, t, globalT) => {
             drawPeacock(ctx, CONFIG.width/2, CONFIG.height/2 + 100, globalT*0.001);
             drawText(ctx, "ORNAMENTAL", CONFIG.width/2, 200, 60, 'center', CONFIG.colors.secondary);

             if (t > 0.5) {
                 drawText(ctx, "USELESS FOR SURVIVAL", CONFIG.width/2, CONFIG.height - 200, 40, 'center', CONFIG.colors.dimText);
             }
        }
    },
    // 8. Caloric Inefficiency (42-53s)
    {
        start: 42000, end: 53000,
        render: (ctx, t, globalT) => {
             // Battery draining
             const w = 400;
             const h = 150;
             const fill = Math.max(0, 1 - t*1.5);

             ctx.strokeStyle = '#fff';
             ctx.lineWidth = 10;
             ctx.strokeRect(CONFIG.width/2 - w/2, CONFIG.height/2 - h/2, w, h);

             ctx.fillStyle = fill > 0.3 ? CONFIG.colors.highlight : CONFIG.colors.danger;
             ctx.fillRect(CONFIG.width/2 - w/2 + 10, CONFIG.height/2 - h/2 + 10, (w-20)*fill, h-20);

             drawText(ctx, "CALORIES", CONFIG.width/2, CONFIG.height/2 - 100, 40);
             drawText(ctx, "INEFFICIENT", CONFIG.width/2, CONFIG.height/2 + 150, 60, 'center', CONFIG.colors.danger);
        }
    },
    // 9. Swipe Left (53-61s)
    {
        start: 53000, end: SCENE_DATA.duration,
        render: (ctx, t, globalT) => {
            const x = -t * 2000;
            drawText(ctx, "REJECTED", CONFIG.width/2 + x, CONFIG.height/2, 100, 'center', CONFIG.colors.danger);
        }
    }
];

/** RECORDING */
let recorder;
let chunks = [];

function startRecording() {
    const stream = canvas.captureStream(CONFIG.fps);
    recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = saveVideo;
    recorder.start();
}
function stopRecording() { if (recorder && recorder.state !== 'inactive') recorder.stop(); }
function saveVideo() {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scene_02.webm';
    a.click();
}

let startTime = null;
function loop(timestamp) {
    if (!startTime) { startTime = timestamp; startRecording(); }
    const elapsed = timestamp - startTime;

    // Background
    ctx.fillStyle = CONFIG.colors.bg;
    ctx.fillRect(0,0,CONFIG.width,CONFIG.height);

    const shot = SHOTS.find(s => elapsed >= s.start && elapsed < s.end);
    if (shot) {
        shot.render(ctx, (elapsed - shot.start)/(shot.end - shot.start), elapsed);
    } else if (elapsed > SCENE_DATA.duration) {
        stopRecording();
        return;
    }
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
